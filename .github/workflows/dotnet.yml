name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Build both plugins
      run: dotnet build Jimakufin.sln -c Release
    - name: Test shared client
      run: dotnet test Tests/Jimaku.Tests.csproj -c Release --no-build
    - name: Package plugins
      shell: pwsh
      run: ./scripts/package.ps1 -NoBuild
    - name: Validate manifest generation
      shell: pwsh
      run: ./scripts/update-manifest.ps1 -Repository $env:GITHUB_REPOSITORY -OutputPath artifacts/manifest.json
    - uses: actions/upload-artifact@v4
      with:
        name: Emby.Jimaku
        path: artifacts/Emby.Jimaku.zip
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: Jellyfin.Jimakufin
        path: |
          artifacts/Jellyfin.Jimakufin.zip
          artifacts/manifest.json
        if-no-files-found: error
