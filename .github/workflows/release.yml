name: Release Jimakufin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build Jimakufin.sln -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet test Tests/Jimaku.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Package and generate repository manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          ./scripts/package.ps1 -NoBuild
          ./scripts/update-manifest.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -Timestamp $env:RELEASE_DATE -Changelog $env:RELEASE_NOTES -OutputPath artifacts/manifest.json
      - name: Upload packages and install manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/Emby.Jimaku.zip artifacts/Jellyfin.Jimakufin.zip artifacts/manifest.json --clobber
